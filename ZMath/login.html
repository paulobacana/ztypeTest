<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-MATH | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Orbitron', sans-serif; }</style>
</head>
<body class="bg-[#0f0f1a] h-screen flex items-center justify-center text-white">
    <div class="w-full max-w-md p-8 bg-black/60 backdrop-blur-xl border border-cyan-500/30 rounded-2xl shadow-2xl">
        <h2 class="text-3xl font-bold text-center mb-8 bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">ACESSO AO SISTEMA</h2>
        
        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-xs text-cyan-400 uppercase tracking-widest mb-2">Identificação (Email)</label>
                <input type="email" id="email" required class="w-full bg-white/5 border border-white/10 p-3 rounded-lg focus:outline-none focus:border-cyan-500 transition-all">
            </div>
            <div>
                <label class="block text-xs text-cyan-400 uppercase tracking-widest mb-2">Código de Acesso (Senha)</label>
                <input type="password" id="password" required class="w-full bg-white/5 border border-white/10 p-3 rounded-lg focus:outline-none focus:border-cyan-500 transition-all">
            </div>
            
            <button type="submit" class="w-full py-4 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg uppercase tracking-widest transition-all shadow-[0_0_15px_rgba(6,182,212,0.3)]">
                Entrar
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-500">Novo por aqui? <a href="#" class="text-cyan-400 hover:underline">Registrar Unidade</a></p>
        </div>
    </div>
</body>
</html>
