<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Orbitron', sans-serif; }
        .bg-radial { background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%); }
    </style>
</head>
<body class="bg-radial h-screen flex items-center justify-center overflow-hidden m-0 text-white">

    <div id="menuPrincipal" class="text-center p-12 bg-black/60 backdrop-blur-xl border border-cyan-500/30 rounded-2xl shadow-[0_0_50px_rgba(6,182,212,0.15)] z-10 w-96">
        <h1 class="text-6xl font-bold bg-gradient-to-b from-cyan-400 to-blue-600 bg-clip-text text-transparent mb-10 tracking-tighter">
            Z-MATH
        </h1>
        
        <div class="flex flex-col gap-5">
            <button id="btnStart" class="group relative px-6 py-4 bg-cyan-500/10 border border-cyan-500/50 rounded-lg text-cyan-400 font-bold uppercase tracking-widest transition-all hover:bg-cyan-500 hover:text-black hover:shadow-[0_0_20px_rgba(6,182,212,0.5)] active:scale-95">
                Iniciar
            </button>
            
            <button id="btnOptions" class="px-6 py-4 bg-white/5 border border-white/10 rounded-lg text-gray-300 font-bold uppercase tracking-widest transition-all hover:bg-white/10 hover:border-white/30 active:scale-95">
                Opções
            </button>
            
            <button id="btnExit" class="px-6 py-4 bg-transparent border border-red-500/30 rounded-lg text-red-500/70 font-bold uppercase tracking-widest transition-all hover:bg-red-500/20 hover:text-red-500 active:scale-95">
                Sair
            </button>
        </div>
    </div>


    <div id="optionsModal" class="fixed inset-0 z-[200] hidden flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="bg-gray-900 border border-cyan-500/30 p-8 rounded-2xl w-full max-w-md shadow-[0_0_50px_rgba(6,182,212,0.2)]">
            <h2 class="text-2xl font-bold text-cyan-400 mb-6 uppercase tracking-tighter">Configurações de Combate</h2>
    
            <div class="mb-8">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs uppercase tracking-widest text-gray-400">Nível de Cálculo</label>
                    <span id="difficultyLabel" class="text-cyan-400 font-bold">Normal</span>
                </div>
                <input type="range" id="difficultySlider" min="0" max="3" step="1" value="2" 
                    class="w-full h-2 bg-gray-800 rounded-lg appearance-none cursor-pointer accent-cyan-500">
                <div class="flex justify-between text-[10px] text-gray-500 mt-2 uppercase">
                    <span>Muito Fácil</span>
                    <span>Difícil</span>
                </div>
                <div class="mt-4 p-3 bg-black/40 rounded border border-white/5 text-center">
                    <span class="text-gray-500 text-xs block mb-1">Exemplo de alvo:</span>
                    <span id="difficultyExample" class="text-xl font-mono text-white">23 + 17 = ?</span>
                </div>
            </div>
    
            <div class="space-y-3 mb-8">
                <label class="text-xs uppercase tracking-widest text-gray-400 block mb-4">Operadores Adicionais</label>
                
                <div class="grid grid-cols-2 gap-4">
                    <label class="flex items-center space-x-3 cursor-pointer group">
                        <input type="checkbox" id="checkMulti" class="form-checkbox h-5 w-5 rounded border-gray-700 bg-gray-800 text-cyan-500 focus:ring-cyan-500 focus:ring-offset-gray-900">
                        <span class="text-gray-300 group-hover:text-white transition-colors">Multiplicação</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer group">
                        <input type="checkbox" id="checkDiv" class="form-checkbox h-5 w-5 rounded border-gray-700 bg-gray-800 text-cyan-500">
                        <span class="text-gray-300 group-hover:text-white transition-colors">Divisão</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer group">
                        <input type="checkbox" id="checkPot" class="form-checkbox h-5 w-5 rounded border-gray-700 bg-gray-800 text-cyan-500">
                        <span class="text-gray-300 group-hover:text-white transition-colors">Potenciação</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer group">
                        <input type="checkbox" id="checkRad" class="form-checkbox h-5 w-5 rounded border-gray-700 bg-gray-800 text-cyan-500">
                        <span class="text-gray-300 group-hover:text-white transition-colors">Radiciação</span>
                    </label>
                </div>
            </div>

            <div class="mt-6 p-4 bg-gray-800/40 rounded-xl border border-white/5">
                <div class="flex items-center justify-between">
                    <label class="flex items-center space-x-3 cursor-pointer group">
                        <input type="checkbox" id="checkMix" class="form-checkbox h-5 w-5 rounded border-gray-700 bg-gray-800 text-cyan-500">
                        <span class="text-gray-200 font-bold">Misturar Operações</span>
                    </label>
                    <button id="btnCustomizeMix" class="text-[10px] uppercase tracking-widest text-cyan-400 hover:text-cyan-300 underline decoration-cyan-500/50 underline-offset-4 transition-colors">
                        Personalizar
                    </button>
                </div>
            </div>
            
            <div id="customizeModal" class="fixed inset-0 z-[250] hidden flex items-center justify-center bg-black/60 backdrop-blur-md p-4">
                <div class="bg-gray-900 border border-cyan-500/50 p-6 rounded-xl w-full max-w-xs shadow-2xl">
                    <h3 class="text-cyan-400 text-xs uppercase tracking-[0.2em] mb-4 font-bold">Incluir na Mistura:</h3>
                    
                    <div class="grid grid-cols-1 gap-3 mb-6" id="mixOptionsContainer">
                        <label class="flex items-center space-x-3 p-2 hover:bg-white/5 rounded-lg cursor-pointer">
                            <input type="checkbox" id="mixMulti" checked class="accent-cyan-500">
                            <span class="text-sm text-gray-300">Multiplicação (×)</span>
                        </label>
                        <label class="flex items-center space-x-3 p-2 hover:bg-white/5 rounded-lg cursor-pointer">
                            <input type="checkbox" id="mixDiv" class="accent-cyan-500">
                            <span class="text-sm text-gray-300">Divisão (/)</span>
                        </label>
                        <label class="flex items-center space-x-3 p-2 hover:bg-white/5 rounded-lg cursor-pointer">
                            <input type="checkbox" id="mixPot" class="accent-cyan-500">
                            <span class="text-sm text-gray-300">Potenciação (²)</span>
                        </label>
                        <label class="flex items-center space-x-3 p-2 hover:bg-white/5 rounded-lg cursor-pointer">
                            <input type="checkbox" id="mixRad" class="accent-cyan-500">
                            <span class="text-sm text-gray-300">Radiciação (√)</span>
                        </label>
                    </div>
            
                    <button id="closeCustomize" class="w-full py-2 bg-gray-800 text-white text-xs font-bold rounded uppercase tracking-widest hover:bg-gray-700">
                        Confirmar
                    </button>
                </div>
            </div>
    
            <button id="closeOptions" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg transition-all active:scale-95">
                SALVAR E VOLTAR
            </button>
        </div>
    </div>

    <script type="module" src="js/menu.js"></script>
</body>
</html>
